name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pyproject vyžaduje >=3.12
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q
      - name: ruff
        run: ruff check .
